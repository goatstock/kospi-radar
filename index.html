 document.querySelectorAll(m=="KR"?"[data-rti] .ixs,[data-rts] .rtt":"[data-rtui] .ixs,[data-rtus] .rtt").forEach(e=>e.innerHTML=`⚠ 시세 수신 실패 · 마지막 정상 ${t}`)}

function agg(bars,tf){if(tf=="D")return bars;const out=[];let cur=null,key=null;

  if(cur)out.push(cur);return out}

  svg.addEventListener("wheel",e=>{e.preventDefault();ZN=Math.round(n*(e.deltaY>0?1.25:0.8));drawChart()},{passive:false});
