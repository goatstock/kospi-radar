.cell.tgt{background:var(--accBg)}.cell.tgt span{color:var(--accD)}.cell.tgt b{color:var(--accD)!important}.cell.stp{background:var(--upA)}.cell.stp span,.cell.stp b{color:var(--risk)!important}
.sc.b{background:linear-gradient(125deg,#E53950,#FF6B5E);color:#fff}.grade.b{background:linear-gradient(140deg,#E53950,#FF6B5E);box-shadow:0 8px 20px rgba(229,57,80,.28)}body[data-mt=dark] .sc.b,body[data-mt=dark] .grade.b{background:linear-gradient(125deg,#FF4D66,#FF7A6B)}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th{color:var(--mute);font-weight:500;text-align:right;padding:6px 4px;white-space:nowrap}th:first-child,td:first-child{text-align:left}td{text-align:right;padding:8px 4px;border-top:1px solid var(--line);white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--nav);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px max(0px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(0px,env(safe-area-inset-left,0px))}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--navOff);font-size:11px;cursor:pointer;min-height:50px}
nav button.on{color:var(--acc);font-weight:700}
body[data-mt=dark] nav button.on{color:var(--acc)}
.empty{padding:18px 0;text-align:center;color:var(--mute);font-size:14px;line-height:1.6}

.lg{display:flex;gap:12px;font-size:11px;color:var(--mute);flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

<body>
<header><img src="logo-t.png" alt="" width="40" height="30" style="flex:none;object-fit:contain"><b style="font-family:Inter,sans-serif;font-size:21px;font-weight:800;letter-spacing:-1px;color:var(--ink)">GOAT <span style="color:var(--acc)">STOCK</span></b><span class="badge" id="badge">…</span>
<button class="pill" id="installBtn" hidden onclick="installApp()">앱 설치</button>
<button class="iconbtn" onclick="go('find')" aria-label="종목 검색"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
<button class="iconbtn" id="themeBtn" onclick="toggleTheme()" aria-label="화면 밝기 바꾸기"></button></header>
<main class="wrap" id="view"><div class="empty">불러오는 중…</div></main>
<nav id="nav">
<button data-v="kr" onclick="go('kr')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>국내</button>
<button data-v="us" onclick="go('us')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v20"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>미장</button>
<button data-v="macro" onclick="go('macro')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>매크로</button>
<button data-v="news" onclick="go('news')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/></svg>속보</button>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(v,d)=>v==null||isNaN(v)?"-":Number(v).toLocaleString("ko-KR",{maximumFractionDigits:d??0});
const pct=v=>v==null?'<span class="mu">-</span>':`<span class="${v>0?"up":v<0?"dn":""}">${v>0?"+":""}${Number(v).toFixed(2)}%</span>`;
const money=(v,m)=>m=="US"?(v>=1e9?"$"+(v/1e9).toFixed(1)+"B":"$"+(v/1e6).toFixed(0)+"M"):(v>=1e12?(v/1e12).toFixed(2)+"조원":Math.round(v/1e8).toLocaleString("ko-KR")+"억원");
const won=(v,m)=>m=="US"?"$"+fmt(v,2):fmt(v)+"원";
const CACHE={};
const J=p=>CACHE[p]||(CACHE[p]=fetch(p).then(r=>{if(!r.ok)throw new Error("자료를 찾지 못했습니다");return r.json()}).catch(e=>{delete CACHE[p];throw e}));
const DISC='<div class="note">점수와 신호는 분석 참고 정보입니다. 수익을 보장하거나 개인별 투자 자문을 드리지 않으며, 투자 판단과 손익은 본인 책임입니다.</div>';
/* theme */
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function paintTheme(){const d=document.body.dataset.mt=="dark";$("#themeBtn").innerHTML=d?SUN:MOON;document.documentElement.style.background=d?"#10111B":"#F7F8FC";document.querySelector('meta[name=theme-color]').content=d?"#10111B":"#F7F8FC"}
function toggleTheme(){const t=document.body.dataset.mt=="dark"?"light":"dark";document.body.dataset.mt=t;try{localStorage.setItem("m_theme",t)}catch(e){}paintTheme();if(VIEW=="stock"&&CUR)drawChart()}
/* install */
let _dp=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();_dp=e;$("#installBtn").hidden=false});
function installApp(){if(_dp){_dp.prompt();_dp.userChoice.finally(()=>{_dp=null;$("#installBtn").hidden=true})}}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
/* trial */
const TRIAL_MS=72*3600*1000,HARD_STOP=new Date("2026-12-10T23:59:00+09:00").getTime(),TKEY="gs_trial_start";
function tGet(){try{return Number(localStorage.getItem(TKEY))||0}catch(e){return 0}}
function tSet(v){try{localStorage.setItem(TKEY,String(v))}catch(e){}}
function leftText(ms){const h=Math.floor(ms/3600000);return h>=24?`${Math.floor(h/24)}일 ${h%24}시간`:`${h}시간 ${Math.floor(ms%3600000/60000)}분`}
function gate(){const now=Date.now(),st=tGet();
  if(now>HARD_STOP)return ended("이 체험판의 사용 기한(2026-12-10)이 지났습니다.");
  if(!st)return agree();
  const end=Math.min(st+TRIAL_MS,HARD_STOP);
  if(now>=end)return ended("3일 체험 기간이 끝났습니다.");
  $("#badge").textContent=leftText(end-now)+" 남음";$("#nav").style.display="";return true}
function shell(h){$("#nav").style.display="none";$("#view").innerHTML=h}
function agree(){shell(`<div class="card" style="display:flex;flex-direction:column;gap:12px"><img src="wordmark.png" alt="GOAT STOCK" style="width:240px;max-width:100%;align-self:center"><b style="font-size:22px;letter-spacing:-.02em;line-height:1.3;text-align:center">3일 무료 체험</b><span class="mu" style="font-size:13px;margin-top:-6px;text-align:center">코스피 · 미장 레이더</span>
  <div style="font-size:14px;color:var(--sub);line-height:1.6">국내 950종목과 미국 S&amp;P500 533종목의 시세·수급·뉴스를 점수로 매긴 결과를 봅니다. 전 종목 차트(일·주·월), 투자자별 수급, 점수 근거, 세계 지표, 속보가 들어 있습니다. 시작을 누른 때부터 <b>72시간</b> 쓸 수 있습니다.</div>
  <div class="warnbox"><b>시작 전에 확인해 주세요</b><span>· 모든 정보는 참고용이며 수익을 보장하지 않습니다.<br>· 투자 판단과 손익은 본인 책임입니다.<br>· 개별 종목 상담이나 매매 대행은 하지 않습니다.<br>· 최근 검증에서 장중 '매수' 판정은 비용을 빼면 평균 손실이었습니다.</span></div>
  <button id="startBtn" class="pill" style="height:54px;border-radius:14px;font-size:16px">동의하고 3일 체험 시작</button>
  <div class="note">휴대폰에 앱으로 깔기: 갤럭시는 위쪽 [앱 설치] 버튼, 아이폰은 사파리 공유 버튼 → 홈 화면에 추가</div>

const LVC={"적극 매수":"var(--up)","매수":"#FF8A95","매수대기":"#FFC2C8","관망":"var(--line)","매도":"#8EBBFF","적극 매도":"var(--dn)"};
function drawMinute(){const box=$("#chart"),L=LIVE.tf[TF]||[];if(L.length<2){box.innerHTML='<div class="empty">분봉 자료가 없습니다</div>';return}
  const [a0,a1,N]=win(L.length,120),B=L.slice(a0,a1),W=360,H=200,VH=40,P=6,top=8;
  const hi=Math.max(...B.map(b=>Math.max(b[2],b[6]))),lo=Math.min(...B.map(b=>Math.min(b[3],b[6])));const y=v=>top+(hi-v)/(hi-lo||1)*(H-top-P),bw=W/N,vmax=Math.max(...B.map(b=>b[5]))||1;
  let s=`<svg data-n="${N}" viewBox="0 0 ${W} ${H+VH+18}" width="100%" role="img" aria-label="${TF}분봉 차트">`;

   if(b[7]){const yy=Math.min(y(b[3])+4,H-14);s+=`<g><title>${esc(b[0]+" 매수 신호: "+b[7])}</title><path d="M${x} ${yy} l-7 12 h14 z" fill="var(--buy)" stroke="var(--card)" stroke-width="1.5"/></g>`}
   if(b[8]){const yy=Math.max(y(b[2])-4,top+14);s+=`<g><title>${esc(b[0]+" 매도 신호: "+b[8])}</title><path d="M${x} ${yy} l-7 -12 h14 z" fill="var(--sell)" stroke="var(--card)" stroke-width="1.5"/></g>`}
   if(Number(TF)>=10&&!b[7]&&!b[8]){const lv=judgeAt(b[0],Number(TF));if(lv&&/매수$/.test(lv)&&lv!="매수대기")s+=`<circle cx="${x}" cy="${y(b[3])+8}" r="4" fill="var(--buy)"><title>${esc(b[0]+" 장중 판정: "+lv)}</title></circle>`;
    else if(lv&&/매도/.test(lv))s+=`<circle cx="${x}" cy="${y(b[2])-8}" r="4" fill="var(--sell)"><title>${esc(b[0]+" 장중 판정: "+lv)}</title></circle>`}});
  s+=`<polyline points="${B.map((b,i)=>`${(i*bw+bw/2).toFixed(1)},${y(b[6]).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--ma20)" stroke-width="1.4" stroke-dasharray="3 2"/>`;

   zoomBar()+(sig.length?`<div class="reasons" style="margin-top:6px">${sig.map(b=>`<div><b style="color:var(${b[7]?"--buy":"--sell"})">${b[0]}</b><span>${esc(b[7]?"매수 · "+b[7]:"매도 · "+b[8])}</span></div>`).join("")}</div>`:"");
  bindZoom();const J2=LIVE.judge||[];const jb=$("#judge");if(jb&&J2.length){const last=J2[J2.length-1];
   jb.innerHTML=`<div style="font-size:13px;color:var(--mute);margin-top:6px">장중 판정 흐름 (5분마다)</div><div style="display:flex;height:14px;border-radius:4px;overflow:hidden;margin:6px 0">${J2.map(j=>`<div title="${esc(j[0]+" "+j[1])}" style="flex:1;background:${LVC[j[1]]||"var(--line)"}"></div>`).join("")}</div>

  document.querySelectorAll("#tfseg button").forEach(b=>b.classList.toggle("on",b.dataset.tf==TF))}
function drawChart(){const d=CUR;if(!d)return;const box=$("#chart");if(!box)return;if(LIVE&&!["D","W","M"].includes(TF))return drawMinute();
  const all=agg(d.bars,TF);if(all.length<2){box.innerHTML='<div class="empty">차트 자료가 부족합니다</div>';return}
  const M5=ma(all,5),M20=ma(all,20),M60=ma(all,60);
  const [b0,b1,N]=win(all.length,TF=="D"?90:TF=="W"?60:40),B=all.slice(b0,b1),off=b0;
  const W=360,H=200,VH=44,P=6,top=8;
  const vals=B.flatMap(b=>[b[2],b[3]]).concat([M5,M20,M60].flatMap(L=>L.slice(off).filter(v=>v!=null)));
  const hi=Math.max(...vals),lo=Math.min(...vals);const y=v=>top+(hi-v)/(hi-lo||1)*(H-top-P);const bw=W/N;
  const vmax=Math.max(...B.map(b=>b[5]||0))||1;
  let s=`<svg data-n="${N}" viewBox="0 0 ${W} ${H+VH+18}" width="100%" role="img" aria-label="${esc(d.name)} ${TF=="D"?"일봉":TF=="W"?"주봉":"월봉"} 차트">`;
  [0.25,0.5,0.75].forEach(f=>{const yy=top+(H-top-P)*f;s+=`<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="0.5"/>`});
  B.forEach((b,i)=>{const x=i*bw+bw/2,up=b[4]>=b[1],c=up?"var(--up)":"var(--dn)";
   s+=`<line x1="${x}" x2="${x}" y1="${y(b[2])}" y2="${y(b[3])}" stroke="${c}" stroke-width="1"/><rect x="${x-bw*.36}" y="${Math.min(y(b[1]),y(b[4]))}" width="${bw*.72}" height="${Math.max(1,Math.abs(y(b[1])-y(b[4])))}" fill="${c}"/>`;
   const vh=(b[5]||0)/vmax*(VH-4);s+=`<rect x="${x-bw*.36}" y="${H+VH-vh}" width="${bw*.72}" height="${vh}" fill="${c}" opacity="0.45"/>`});
  [[M5,"var(--ma5)"],[M20,"var(--ma20)"],[M60,"var(--ma60)"]].forEach(([L,c])=>{const pts=L.slice(off).map((v,i)=>v==null?null:`${(i*bw+bw/2).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(" ");if(pts)s+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.4"/>`});

   if(a0<=b0&&a1>b1)s+=`<path d="M${x} ${y(B[i][3])+4} l-5 9 h10 z" fill="var(--up)"/>`;

  box.innerHTML=s+`<div class="lg"><span><i style="background:var(--ma5)"></i>5이평</span><span><i style="background:var(--ma20)"></i>20이평</span><span><i style="background:var(--ma60)"></i>60이평</span><span><span class="up">▲</span> 골든크로스(5>20)</span><span><span class="dn">▼</span> 데드크로스</span></div>`+zoomBar();bindZoom();
  document.querySelectorAll("#tfseg button").forEach(b=>b.classList.toggle("on",b.dataset.tf==TF))}
function flowChart(fl,asof){const L=fl.slice(-30);if(!L.length)return"";const W=360,Hh=60,bw=W/L.length;const ser=[["외국인",1],["기관",2],["개인",3]];

    ${si==2?`<text x="0" y="${Hh+13}" font-size="10">${md(L[0][0])}</text><text x="${W/2}" y="${Hh+13}" font-size="10" text-anchor="middle">${md(L[Math.floor(L.length/2)][0])}</text><text x="${W}" y="${Hh+13}" font-size="10" text-anchor="end" style="fill:var(--acc);font-weight:700">${isToday?"오늘 ":""}${md(last)} ▲</text>`:""}</svg>`}).join("")+
   `<div class="note" style="margin-top:4px">맨 오른쪽 옅은 칸이 ${isToday?"오늘":"가장 최근 거래일("+md(last)+")"}입니다. 왼쪽으로 갈수록 과거입니다.</div>`}
