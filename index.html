async function pMax(code,close,m="KR"){const q=(await pQuote([code],m))[code];const px=q&&q[0]||close;const P=pLoad(m),h=P.pos[code];

function pFill(P,m,o,q){const c=PM[m],px=q[0],h=P.pos[o.code]||{n:0,avg:0,name:o.name},amt=px*o.n,r2=v=>m=="US"?Math.round(v*100)/100:Math.round(v),fee=r2(amt*c.fee);

 else{if(o.n>h.n)return`보유 수량(${fmt(h.n)}주)보다 많습니다`;const tax=r2(amt*c.tax),pnl=r2((px-h.avg)*o.n-fee-tax);P.cash+=amt-fee-tax;h.n-=o.n;if(h.n>0)P.pos[o.code]=h;else delete P.pos[o.code];P.log.unshift({t:Date.now(),code:o.code,name:o.name,side:"매도",n:o.n,px,fee,tax,pnl,qt:q[2]||null})}

 {const ab=document.getElementById("ixavg");if(ab){const pl=AV?(last[4]/AV-1)*100:null;ab.innerHTML=`<div class="ixavg"><label>내 평단 <input id="ixavgin" inputmode="decimal" placeholder="예: ${Math.round(last[4])}" value="${AV||""}" onchange="avgSet(this.value)"></label>${pl==null?'<span class="mu">평단을 넣으면 지금 가격 대비 손익률을 보여 드립니다(이 브라우저에만 저장)</span>':`<b class="${pl>0?"up":pl<0?"dn":""}">${pl>0?"+":""}${pl.toFixed(2)}%</b><span class="mu">현재가 대비 · 수수료·세금 제외</span><button class="pill" style="height:26px;font-size:11.5px" onclick="avgSet('')">지우기</button>`}</div>`}}

 document.getElementById("ixft").innerHTML=`<div class="note">${IXS.note?esc(IXS.note)+" · ":""}자료: ${esc(D.src)} · ${esc(D.made)} 갱신 · 참고용</div>${IXS.mk?`<button class="pill" style="margin-top:8px" onclick="const m=IXS.mk;idxClose();goMkt(m[0],m[1])">이 시장 종목 보기 ›</button>`:""}`;

/* 11-14 회장님 지시: 채팅창(시안) — 로그인 회원만, 서버에서 링크·연락처·리딩방·수익 보장 글 차단, 신고 3번이면 숨김, 7일 보관 */

function chatToggle(){CH.open=!CH.open;let pn=document.getElementById("chatpn");if(!CH.open){if(pn)pn.remove();clearInterval(CH.timer);return}
 document.body.insertAdjacentHTML("beforeend",`<div id="chatpn" class="chatpn card"><div class="chhd"><b>💬 투자자 라운지</b><span class="ptag">시안</span><button class="iconbtn" onclick="chatToggle()" aria-label="닫기">✕</button></div><div id="vote" class="vote"></div><div class="chrule">투자 권유·종목 추천 대가 요구·리딩방 홍보·연락처·링크는 올릴 수 없고, 신고 3번이면 숨겨집니다. 대화는 7일 뒤 지워집니다. 여기 글은 회원 개인 의견이며 GOAT STOCK의 의견이 아닙니다.</div><div id="chlist" class="chlist"><div class="empty">불러오는 중…</div></div><form class="chin" onsubmit="event.preventDefault();chatSend()"><input id="chtxt" maxlength="300" placeholder="메시지 입력 (300자)" autocomplete="off"><button class="pill">보내기</button></form><div id="chmsg" class="note"></div></div>`);
 CH.last=0;CH.rows=[];chatPull();voteLoad();CH.timer=setInterval(()=>{if(!document.hidden)chatPull()},5000)}

 if(!j.ok){box.innerHTML=`<div class="note">${esc(j.msg||"")}</div>`;return}const n=j.up+j.dn,pu=n?Math.round(j.up/n*100):50,md=j.day.slice(5).replace("-","/");
 box.innerHTML=`<div class="vtq"><b>🗳 ${md} 코스피 롱? 숏?</b><span class="mu">${n}명 참여 · 회원 롱숏 심리(참고용)</span></div><div class="vtb"><button class="${j.mine==1?"on up":""}" ${j.open?"disabled":""} onclick="voteLoad('up')">▲ 롱</button><div class="vtbar"><i style="width:${pu}%"></i><span>롱 ${pu}% : 숏 ${100-pu}%</span></div><button class="${j.mine==-1?"on dn":""}" ${j.open?"disabled":""} onclick="voteLoad('dn')">▼ 숏</button></div>`}catch(e){box.innerHTML=""}}
async function chatPull(){try{const r=await fetch(`api/chat?after=${CH.last}`,{credentials:"same-origin"});const j=await r.json();if(!j.ok){document.getElementById("chlist").innerHTML=`<div class="empty">${esc(j.msg||"불러오지 못했습니다")}</div>`;return}
 CH.me=j.me;CH.owner=j.owner;if(j.rows.length){CH.rows=CH.rows.concat(j.rows).slice(-150);CH.last=j.rows[j.rows.length-1][0]}chatDraw()}catch(e){}}
function chatDraw(){const L=document.getElementById("chlist");if(!L)return;const atB=L.scrollHeight-L.scrollTop-L.clientHeight<40;
 L.innerHTML=CH.rows.length?CH.rows.map(([id,n,t,at,mine])=>{const d=new Date(at+9*3600e3);return `<div class="chm${mine?" me":""}"><div class="chn"><b>${esc(n)}</b><span>${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}</span>${mine||CH.owner?`<button onclick="chatAct('del',${id})">지우기</button>`:`<button onclick="chatAct('report',${id})">신고</button>`}</div><div class="cht">${esc(t)}</div></div>`}).join(""):'<div class="empty">첫 메시지를 남겨 보세요</div>';

 document.getElementById("chmsg").textContent=j.ok?"":(j.msg||"보내지 못했습니다");if(j.ok){i.value="";chatPull()}}
