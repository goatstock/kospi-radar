name: AI 상대 순위 매일 계산
on:
  schedule:
    - cron: "45 7 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/lab/rank_daily.py"]
permissions:
  id-token: write
  contents: read
concurrency: { group: rank, cancel-in-progress: true }
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q lightgbm pandas numpy
      - run: python tools/lab/rank_daily.py
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/deploy/upload.js
        env:
          FILES: static/rank_kr.json
